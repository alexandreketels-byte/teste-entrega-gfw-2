<!DOCTYPE html>
<html>
<head>
  <title>Controle de Entregas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #15181d;
      --bg-elevated: #1b1f26;
      --bg-panel: #20242c;
      --bg-panel-hover: #262b34;
      --border: #2b3038;
      --border-soft: #23272f;
      --text: #e9ebef;
      --text-muted: #8b93a1;
      --text-faint: #5f6773;

      --accent: #f0a840;
      --accent-hover: #f6b85c;
      --accent-soft: rgba(240, 168, 64, 0.14);
      --accent-text: #17130a;

      --danger: #ef5b5b;
      --danger-soft: rgba(239, 91, 91, 0.14);
      --success: #3ecf8e;
      --success-soft: rgba(62, 207, 142, 0.14);
      --info: #4fb3c9;

      --radius: 10px;
      --radius-sm: 7px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 28px 24px 60px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subtitulo {
      color: var(--text-muted);
      font-size: 13.5px;
      margin: 0 0 22px;
    }

    /* ─── Filtros: segmented control ─── */
    .filtros {
      display: inline-flex;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
      margin-bottom: 20px;
      gap: 2px;
    }

    .filtros button {
      padding: 8px 18px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .filtros button:hover { color: var(--text); }

    .btn-todos.ativo { background: var(--bg-panel-hover); color: var(--text); }
    .btn-pendente.ativo { background: var(--danger-soft); color: var(--danger); }
    .btn-respondido.ativo { background: var(--success-soft); color: var(--success); }

    .ativo { box-shadow: none; }

    /* ─── Cards de resumo ─── */
    .cards {
      display: flex;
      gap: 14px;
      margin: 0 0 20px;
    }

    .card {
      flex: 1;
      padding: 16px 18px;
      border-radius: var(--radius);
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--text-faint);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13.5px;
    }

    .card.total { border-left-color: var(--accent); }
    .card.pendente { border-left-color: var(--danger); }
    .card.respondido { border-left-color: var(--success); }

    .numero-total, .numero-pendente, .numero-respondido {
      display: block;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      margin-top: 4px;
    }

    .numero-total { color: var(--accent); }
    .numero-pendente { color: var(--danger); }
    .numero-respondido { color: var(--success); }

    /* ─── Painéis de ação ─── */
    .acoes-grupo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--accent-soft);
      border: 1px solid rgba(240, 168, 64, 0.3);
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .acoes-grupo strong {
      font-size: 13px;
      color: var(--accent);
      font-weight: 700;
      margin-right: 2px;
    }

    .acoes {
      margin-top: 0;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--bg-elevated);
      border: 1px solid var(--border-soft);
    }

    /* ─── Botões ─── */
    button {
      font-family: inherit;
    }

    .btn-lote, .btn-importar, .btn-exportar, .btn-modelo, .btn-resp-lote {
      padding: 9px 16px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      font-size: 13.5px;
      transition: filter 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .btn-modelo {
      background: transparent;
      color: var(--accent);
      border-color: rgba(240, 168, 64, 0.45);
    }
    .btn-modelo:hover { background: var(--accent-soft); }

    .btn-resp-lote {
      background: var(--accent);
      color: var(--accent-text);
    }
    .btn-resp-lote:hover { background: var(--accent-hover); }

    .btn-lote {
      background: var(--bg-panel);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-lote:hover { background: var(--bg-panel-hover); }

    .btn-importar {
      background: transparent;
      color: var(--text-muted);
      border-color: var(--border);
    }
    .btn-importar:hover { color: var(--text); border-color: var(--text-faint); }

    .btn-exportar {
      background: transparent;
      color: var(--info);
      border-color: rgba(79, 179, 201, 0.4);
    }
    .btn-exportar:hover { background: rgba(79, 179, 201, 0.12); }

    button:disabled { opacity: 0.6; cursor: default; }

    /* ─── Inputs de arquivo ─── */
    input[type="file"] {
      color: var(--text-muted);
      font-size: 12.5px;
      max-width: 220px;
    }
    input[type="file"]::file-selector-button {
      font-family: inherit;
      font-weight: 600;
      font-size: 12.5px;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-panel);
      color: var(--text);
      cursor: pointer;
      margin-right: 8px;
    }

    /* ─── Tabela ─── */
    .tabela-wrapper {
      overflow-x: auto;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      background: var(--bg-elevated);
      font-size: 13.5px;
    }

    th {
      background: var(--bg-panel);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: none;
      padding: 11px 8px;
      white-space: nowrap;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
    }

    td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--border-soft);
      text-align: center;
      vertical-align: middle;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    /* Coluna Motivo: quebra linha e largura mínima garantida */
    td.col-motivo {
      text-align: left;
      white-space: normal;
      word-break: break-word;
      min-width: 180px;
      max-width: 300px;
      line-height: 1.4;
    }

    td.col-motivo input {
      width: 100%;
      white-space: normal;
      word-break: break-word;
      box-sizing: border-box;
    }

    tbody tr { transition: background 0.1s; }

    tbody tr:hover { background: var(--bg-panel); }

    /* Status como badge/pill, não célula sólida */
    .status-respondido, .status-pendente {
      font-weight: 600;
      font-size: 12px;
      padding: 4px 0;
    }

    .status-respondido {
      color: var(--success);
    }
    .status-respondido::before {
      content: "●";
      margin-right: 5px;
      font-size: 9px;
    }

    .status-pendente {
      color: var(--danger);
    }
    .status-pendente::before {
      content: "●";
      margin-right: 5px;
      font-size: 9px;
    }

    select, input[type="text"], input:not([type]) {
      width: 100%;
      background: var(--bg-panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 13px;
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--accent);
    }

    td button {
      background: var(--bg-panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
    }
    td button:hover { border-color: var(--accent); color: var(--accent); }

    /* Atraso alto: faixa lateral em vez de linha inteira colorida */
    tr.atraso-alto {
      background: transparent !important;
      box-shadow: inset 3px 0 0 var(--danger);
    }

    tr.atraso-alto:hover {
      background: var(--danger-soft) !important;
    }

    ::-webkit-scrollbar { height: 10px; width: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg-elevated); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
  </style>
</head>

<body>

<div class="container">

  <h2>🚚 Entregas Pendentes</h2>
  <p class="subtitulo">Acompanhamento de atrasos por NF e resposta das transportadoras</p>

  <div class="filtros">
    <button class="btn-todos ativo" onclick="filtrar('TODOS', this)">Todos</button>
    <button class="btn-pendente" onclick="filtrar('PENDENTE', this)">Pendentes</button>
    <button class="btn-respondido" onclick="filtrar('RESPONDIDO', this)">Respondidos</button>
  </div>

  <div class="cards">
    <div class="card total" id="totalCard">
      Todos: <span class="numero-total">0</span>
    </div>
    <div class="card pendente" id="pendenteCard">
      Pendentes: <span class="numero-pendente">0</span>
    </div>
    <div class="card respondido" id="respondidoCard">
      Respondidos: <span class="numero-respondido">0</span>
    </div>
  </div>

  <!-- Fluxo para a TRANSPORTADORA responder em lote -->
  <div class="acoes-grupo">
    <strong>📨 Resposta em lote (transportadora):</strong>
    <button class="btn-modelo" onclick="exportarModeloTransportadora()">
      📥 Baixar modelo (NFs pendentes)
    </button>
    <input type="file" id="csvRespostas" accept=".csv">
    <button class="btn-resp-lote" onclick="importarRespostasTransportadora()">
      📤 Importar respostas preenchidas
    </button>
  </div>

  <!-- Ações internas / administrativas -->
  <div class="acoes">
    <button class="btn-lote" onclick="salvarSelecionados()">
      💾 Salvar selecionados (manual)
    </button>

    <input type="file" id="csvFile" accept=".csv">

    <button class="btn-importar" onclick="importarCSV()">
      📂 Importar planilha base (Admin)
    </button>

    <button class="btn-exportar" onclick="exportarExcel()">
      📊 Exportar tudo (Excel/CSV)
    </button>
  </div>

  <div class="tabela-wrapper">
    <table id="tabela">
      <thead>
        <tr>
          <th><input type="checkbox" onclick="selecionarTodos(this)"></th>
          <th>Pedido</th>
          <th>NF</th>
          <th>Transp</th>
          <th>Cidade</th>
          <th>Coleta</th>
          <th>Previsão</th>
          <th>UF</th>
          <th>Atraso dias</th>
          <th>Status</th>
          <th>Agendado</th>
          <th>Em rota</th>
          <th>Status Resp</th>
          <th>Motivo</th>
          <th>Data Resp</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby8IR2a-hfZSDZPfedgpLQv2TE0Da9A_CU0n_OiA7K3hhqO75TeNNebfjFFvgNZIOFu/exec";
let filtroAtual = "TODOS";

// Guarda os dados brutos para exportar com tudo
let dadosGlobais = [];

function formatarData(data) {
  if (!data || isNaN(new Date(data))) return data;
  const d = new Date(data);
  return `${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${d.getUTCFullYear()}`;
}

function filtrar(tipo, btn) {
  filtroAtual = tipo;
  document.querySelectorAll(".filtros button")
    .forEach(b => b.classList.remove("ativo"));
  btn.classList.add("ativo");
  carregarDados();
}

function selecionarTodos(master) {
  document.querySelectorAll(".checkLinha")
    .forEach(c => c.checked = master.checked);
}

async function carregarDados() {
  const tbody = document.querySelector("#tabela tbody");
  tbody.innerHTML = `
    <tr>
      <td colspan="16" style="text-align:center; padding: 30px; color: #8b93a1; font-size: 15px;">
        ⏳ Carregando dados...
      </td>
    </tr>
  `;

  const res = await fetch(API_URL);
  const dados = await res.json();

  // Salva os dados brutos globalmente para o exportar
  dadosGlobais = dados;

  tbody.innerHTML = "";

  let total = 0;
  let pendentes = 0;
  let respondidos = 0;

  dados.slice(1).forEach(linha => {
    // Coluna "Atraso?" (índice 11) foi descontinuada.
    // Status agora depende só de o Motivo estar preenchido.
    const motivoAtual = linha[12] || "";
    const dataResposta = linha[13] || "";
    const status = motivoAtual.trim() ? "RESPONDIDO" : "PENDENTE";

    total++;
    if (status === "RESPONDIDO") { respondidos++; } else { pendentes++; }

    if (filtroAtual === "PENDENTE" && status !== "PENDENTE") return;
    if (filtroAtual === "RESPONDIDO" && status !== "RESPONDIDO") return;

    const tr = document.createElement("tr");
    const diasAtraso = parseInt(linha[7]) || 0;
    if (diasAtraso > 5) tr.classList.add("atraso-alto");

    tr.innerHTML = `
      <td><input type="checkbox" class="checkLinha"></td>
      <td>${linha[0]}</td>
      <td>${linha[1]}</td>
      <td>${linha[2]}</td>
      <td>${linha[3]}</td>
      <td>${formatarData(linha[4])}</td>
      <td>${formatarData(linha[5])}</td>
      <td>${linha[6]}</td>
      <td>${linha[7]}</td>
      <td>${linha[8]}</td>
      <td>${linha[9]}</td>
      <td>${formatarData(linha[10])}</td>
      <td class="${status === 'RESPONDIDO' ? 'status-respondido' : 'status-pendente'}">
        ${status}
      </td>
      <td class="col-motivo"><input value="${motivoAtual}" /></td>
      <td>${formatarData(dataResposta)}</td>
      <td><button onclick="salvar(this)">Salvar</button></td>
    `;

    tbody.appendChild(tr);
  });

  document.getElementById("totalCard").innerHTML =
    `Todos: <span class="numero-total">${total}</span>`;
  document.getElementById("pendenteCard").innerHTML =
    `Pendentes: <span class="numero-pendente">${pendentes}</span>`;
  document.getElementById("respondidoCard").innerHTML =
    `Respondidos: <span class="numero-respondido">${respondidos}</span>`;
}

async function salvar(btn) {
  const tr = btn.parentElement.parentElement;
  const tds = tr.querySelectorAll("td");
  const nf = tds[2].innerText;
  const motivo = tds[13].querySelector("input").value;

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ nf, motivo })
  });

  btn.textContent = "✅ Salvo!";
  btn.style.background = "#28a745";
  btn.style.color = "white";
  btn.disabled = true;

  setTimeout(() => {
    btn.textContent = "Salvar";
    btn.style.background = "";
    btn.style.color = "";
    btn.disabled = false;
    carregarDados();
  }, 2000);
}

async function salvarSelecionados() {
  const linhas = document.querySelectorAll("#tabela tbody tr");
  const lote = [];

  linhas.forEach(tr => {
    const check = tr.querySelector(".checkLinha");
    if (check && check.checked) {
      const tds = tr.querySelectorAll("td");
      const nf = tds[2].innerText;
      const motivo = tds[13].querySelector("input").value;
      if (motivo && motivo.trim()) lote.push({ nf, motivo });
    }
  });

  if (lote.length === 0) {
    alert("Selecione pelo menos uma linha com o Motivo preenchido!");
    return;
  }

  const btnLote = document.querySelector(".btn-lote");
  btnLote.textContent = "⏳ Salvando...";
  btnLote.disabled = true;

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ lote })
  });

  btnLote.textContent = "✅ Lote Salvo!";
  btnLote.style.background = "#28a745";

  setTimeout(() => {
    btnLote.textContent = "💾 Salvar selecionados (manual)";
    btnLote.style.background = "#ff9800";
    btnLote.disabled = false;
    carregarDados();
  }, 2000);
}

// ═══════════════════════════════════════
// Utilitário: parse de CSV (usado tanto no
// import admin quanto no import de respostas)
// ═══════════════════════════════════════
async function lerCSV(file) {
  const texto = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsText(file, "iso-8859-1");
  });

  const separador = texto.includes(";") ? ";" : ",";

  return texto
    .trim()
    .split("\n")
    .map(linha =>
      linha.split(separador).map(cel => cel.trim().replace(/\r/g, "").replace(/^"|"$/g, ""))
    );
}

// ═══════════════════════════════════════
// Modelo para a transportadora: exporta só
// NF + Motivo (vazio) das NFs pendentes
// ═══════════════════════════════════════
function exportarModeloTransportadora() {
  if (!dadosGlobais || dadosGlobais.length < 2) {
    alert("Nenhum dado carregado para gerar o modelo!");
    return;
  }

  const pendentes = dadosGlobais.slice(1).filter(linha => {
    const motivoAtual = linha[12] || "";
    return !motivoAtual.trim();
  });

  if (pendentes.length === 0) {
    alert("Não há NFs pendentes no momento!");
    return;
  }

  const cabecalho = ["NF", "Motivo"];
  const linhas = pendentes.map(linha => [linha[1], ""]);

  const todasLinhas = [cabecalho, ...linhas];
  const csv = todasLinhas
    .map(row => row.map(cel => {
      const v = String(cel ?? "");
      return v.includes(";") || v.includes('"') || v.includes("\n")
        ? `"${v.replace(/"/g, '""')}"`
        : v;
    }).join(";"))
    .join("\r\n");

  const bom = "\uFEFF";
  const blob = new Blob([bom + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  const hoje = new Date();
  const dataHoje = `${String(hoje.getDate()).padStart(2,'0')}-${String(hoje.getMonth()+1).padStart(2,'0')}-${hoje.getFullYear()}`;

  link.href = url;
  link.download = `modelo_transportadora_${dataHoje}.csv`;
  link.click();
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════
// Importa o arquivo que a transportadora
// preencheu (NF + Motivo) e salva em lote
// ═══════════════════════════════════════
async function importarRespostasTransportadora() {
  const fileInput = document.getElementById("csvRespostas");

  if (!fileInput.files.length) {
    alert("Selecione o arquivo preenchido pela transportadora primeiro!");
    return;
  }

  const linhas = await lerCSV(fileInput.files[0]);

  if (linhas.length < 2) {
    alert("Arquivo vazio ou sem dados!");
    return;
  }

  // Detecta as colunas NF e Motivo pelo cabeçalho (não depende da ordem)
  const cabecalho = linhas[0].map(c => c.toLowerCase());
  const idxNf = cabecalho.findIndex(c => c.includes("nf"));
  const idxMotivo = cabecalho.findIndex(c => c.includes("motivo"));

  if (idxNf === -1 || idxMotivo === -1) {
    alert("Não encontrei as colunas 'NF' e 'Motivo' no cabeçalho do arquivo.");
    return;
  }

  const respostas = linhas.slice(1)
    .map(linha => ({ nf: linha[idxNf], motivo: linha[idxMotivo] }))
    .filter(r => r.nf && r.motivo && r.motivo.trim());

  if (respostas.length === 0) {
    alert("Nenhuma linha com Motivo preenchido foi encontrada no arquivo.");
    return;
  }

  const confirmacao = confirm(`Importar ${respostas.length} resposta(s) da transportadora?`);
  if (!confirmacao) return;

  const btn = document.querySelector(".btn-resp-lote");
  btn.textContent = "⏳ Importando...";
  btn.disabled = true;

  const resposta = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ responderLote: true, respostas })
  });

  const resultado = await resposta.text();
  alert(resultado);

  btn.textContent = "📤 Importar respostas preenchidas";
  btn.disabled = false;
  fileInput.value = "";

  carregarDados();
}

async function importarCSV() {
  const fileInput = document.getElementById("csvFile");

  if (!fileInput.files.length) {
    alert("Selecione um arquivo CSV primeiro!");
    return;
  }

  const senha = prompt("🔒 Digite a senha para importar:");
  if (!senha) return;

  const linhas = await lerCSV(fileInput.files[0]);

  if (linhas.length < 2) {
    alert("CSV vazio ou sem dados!");
    return;
  }

  const confirmacao = confirm(
    `Importar ${linhas.length - 1} linha(s) do arquivo "${fileInput.files[0].name}"?\n\nATENÇÃO: Isso substituirá todos os dados da aba!`
  );
  if (!confirmacao) return;

  const btnImportar = document.querySelector(".btn-importar");
  btnImportar.textContent = "⏳ Importando...";
  btnImportar.disabled = true;

  const resposta = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ importarCSV: true, senha: senha, linhas: linhas })
  });

  const resultado = await resposta.text();
  alert(resultado);

  btnImportar.textContent = "📂 Importar planilha base (Admin)";
  btnImportar.disabled = false;
  fileInput.value = "";

  if (resultado.includes("sucesso")) carregarDados();
}

function exportarExcel() {
  if (!dadosGlobais || dadosGlobais.length < 2) {
    alert("Nenhum dado carregado para exportar!");
    return;
  }

  // Cabeçalho igual ao da tabela (sem checkbox e sem coluna Ação)
  const cabecalho = [
    "Pedido", "NF", "Transp", "Cidade", "Coleta", "Previsão",
    "UF", "Atraso dias", "Status", "Agendado", "Em rota",
    "Status Resp", "Motivo", "Data Resp"
  ];

  // Monta linhas: pega os dados brutos e calcula Status Resp igual à tela
  const linhas = dadosGlobais.slice(1).map(linha => {
    const motivoAtual = linha[12] || "";
    const statusResp = motivoAtual.trim() ? "RESPONDIDO" : "PENDENTE";

    return [
      linha[0],                    // Pedido
      linha[1],                    // NF
      linha[2],                    // Transp
      linha[3],                    // Cidade
      formatarData(linha[4]),      // Coleta
      formatarData(linha[5]),      // Previsão
      linha[6],                    // UF
      linha[7],                    // Atraso dias
      linha[8],                    // Status
      linha[9],                    // Agendado
      formatarData(linha[10]),     // Em rota
      statusResp,                  // Status Resp
      motivoAtual,                 // Motivo
      formatarData(linha[13])      // Data Resp
    ];
  });

  // Gera CSV com BOM UTF-8 para o Excel abrir com acentos corretos
  const todasLinhas = [cabecalho, ...linhas];
  const csv = todasLinhas
    .map(row =>
      row.map(cel => {
        const v = String(cel ?? "");
        // Envolve em aspas se tiver vírgula, aspas ou quebra de linha
        return v.includes(",") || v.includes('"') || v.includes("\n")
          ? `"${v.replace(/"/g, '""')}"`
          : v;
      }).join(";")
    )
    .join("\r\n");

  const bom = "\uFEFF";
  const blob = new Blob([bom + csv], { type: "text/csv;charset=utf-8;" });
  const url  = URL.createObjectURL(blob);
  const link = document.createElement("a");

  const hoje = new Date();
  const dataHoje = `${String(hoje.getDate()).padStart(2,'0')}-${String(hoje.getMonth()+1).padStart(2,'0')}-${hoje.getFullYear()}`;

  link.href = url;
  link.download = `entregas_${dataHoje}.csv`;
  link.click();
  URL.revokeObjectURL(url);
}

carregarDados();

</script>
